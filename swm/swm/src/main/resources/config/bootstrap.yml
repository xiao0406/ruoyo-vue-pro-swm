
#======================================#
#========== Server settings ===========#
#======================================#

server:
  port: 8992

#======================================#
#========== Spring settings ===========#
#======================================#

spring:
  
  # 应用程序名称
  application:
    name: swm

  # 当前环境名称（注意：不可设置为 test 它是单元测试专用的名称）
  profiles:
    active: swm

  # 分布式配置中心
  cloud:
    # 服务注册和配置
    nacos:

      # 云端配置覆盖本地配置
      discovery:
        server-addr: 10.50.103.166:8848
#        server-addr: 10.50.103.188:8848
        namespace: ${spring.profiles.active}

      config:
        # 配置中心地址
        server-addr: 10.50.103.166:8848
#        server-addr: 10.50.103.188:8848
        # 命名空间
        namespace: ${spring.profiles.active}
        # 分组
        group: DEFAULT_GROUP
        # 配置文件类型
        file-extension: yml
        # 修改后在线刷新
        refresh-enabled: true
        extension-configs[0]:
          data-id: swm-ext0.yml
          group: DEFAULT_GROUP
          refresh: true
        extension-configs[1]:
          data-id: swm-ext1.yml
          group: DEFAULT_GROUP
          refresh: true

  # 打印横幅
  main:
#    bannerMode: "off"
    allow-bean-definition-overriding: true
    
# 日志配置
logging:
  config: classpath:config/logback-spring.xml

